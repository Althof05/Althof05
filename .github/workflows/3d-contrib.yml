name: generate 3d contribution chart

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/3d-contrib.json

      - name: Commit & push chart
        run: |
          git config user.name "Althof05"
          git config user.email "althofsalman@gmail.com"
          git add profile-3d-contrib/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh 3d contribution chart"
          git push
