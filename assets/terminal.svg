<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Fira Code','Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace" font-size="14">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .win { fill:#1a1b27; }
    .bar { fill:#16161e; }
    .fg  { fill:#c0caf5; }
    .dim { fill:#565f89; }
    .blu { fill:#7aa2f7; }
    .pur { fill:#bb9af7; }
    .grn { fill:#9ece6a; }
    .yel { fill:#e0af68; }
    .red { fill:#f7768e; }
    .cya { fill:#7dcfff; }

    .line { opacity:0; animation: appear .01s linear forwards; }
    @keyframes appear { to { opacity:1; } }

    .l1  { animation-delay: 2.3s; }
    .l2  { animation-delay: 2.55s; }
    .l3  { animation-delay: 2.8s; }
    .l4  { animation-delay: 3.05s; }
    .l5  { animation-delay: 3.3s; }
    .l6  { animation-delay: 3.55s; }
    .l7  { animation-delay: 3.8s; }
    .l8  { animation-delay: 4.05s; }
    .l9  { animation-delay: 4.3s; }
    .l10 { animation-delay: 4.55s; }
    .l11 { animation-delay: 4.8s; }
    .l12 { animation-delay: 5.3s; }

    .typed {
      display:inline-block; overflow:hidden; white-space:nowrap;
      width:0; animation: typing 1.6s steps(16,end) .6s forwards;
    }
    @keyframes typing { to { width: 140px; } }

    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity:0; } }

    .logo { opacity:0; animation: appear .01s linear 2.3s forwards; }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="760" height="410" rx="14" class="win" filter="url(#shadow)"/>
  <rect x="10" y="10" width="760" height="38" rx="14" class="bar"/>
  <rect x="10" y="34" width="760" height="14" class="bar"/>
  <circle cx="34" cy="29" r="6.5" fill="#f7768e"/>
  <circle cx="56" cy="29" r="6.5" fill="#e0af68"/>
  <circle cx="78" cy="29" r="6.5" fill="#9ece6a"/>
  <text x="390" y="34" text-anchor="middle" class="dim" font-size="12">althof@fedora — ptyxis</text>

  <!-- prompt + typed command -->
  <text x="34" y="80"><tspan class="grn">althof@fedora</tspan><tspan class="dim"> ~ </tspan><tspan class="blu">❯ </tspan></text>
  <foreignObject x="152" y="64" width="300" height="24">
    <div xmlns="http://www.w3.org/1999/xhtml" style="color:#c0caf5;font:14px 'Fira Code',Menlo,Consolas,monospace;">
      <span class="typed">fastfetch --me</span>
    </div>
  </foreignObject>

  <!-- ascii logo -->
  <g class="logo" font-size="13">
    <text x="34"  y="128" class="blu">      ██████╗</text>
    <text x="34"  y="146" class="blu">    ██╔═════╝</text>
    <text x="34"  y="164" class="pur">  ██╔╝ █████╗</text>
    <text x="34"  y="182" class="pur">  ██║  ╚═══██║</text>
    <text x="34"  y="200" class="cya">  ╚██████╔══╝</text>
    <text x="34"  y="218" class="cya">   ╚═════╝ A</text>
  </g>

  <!-- fastfetch output -->
  <g>
    <text x="240" y="128" class="line l1"><tspan class="blu" font-weight="bold">althof</tspan><tspan class="dim">@</tspan><tspan class="pur" font-weight="bold">github</tspan></text>
    <text x="240" y="146" class="line l2" ><tspan class="dim">─────────────────────────────</tspan></text>
    <text x="240" y="164" class="line l3"><tspan class="yel" font-weight="bold">Role      </tspan><tspan class="fg">Full-Stack Developer</tspan></text>
    <text x="240" y="182" class="line l4"><tspan class="yel" font-weight="bold">Edu       </tspan><tspan class="fg">CS @ BINUS University</tspan></text>
    <text x="240" y="200" class="line l5"><tspan class="yel" font-weight="bold">Work      </tspan><tspan class="fg">SWE Intern @ Telkom Indonesia</tspan></text>
    <text x="240" y="218" class="line l6"><tspan class="yel" font-weight="bold">OS        </tspan><tspan class="fg">Fedora Linux (MacBook T2, btw)</tspan></text>
    <text x="240" y="236" class="line l7"><tspan class="yel" font-weight="bold">Langs     </tspan><tspan class="fg">TypeScript · Dart · Python · Bash</tspan></text>
    <text x="240" y="254" class="line l8"><tspan class="yel" font-weight="bold">Stack     </tspan><tspan class="fg">React · Flutter · Firebase · Node</tspan></text>
    <text x="240" y="272" class="line l9"><tspan class="yel" font-weight="bold">Uptime    </tspan><tspan class="grn">always shipping 🚀</tspan></text>
    <text x="240" y="290" class="line l10"><tspan class="yel" font-weight="bold">Theme     </tspan><tspan class="fg">Catppuccin Mocha, obviously</tspan></text>

    <!-- color palette row like fastfetch -->
    <g class="line l11">
      <rect x="240" y="304" width="22" height="14" fill="#f7768e"/>
      <rect x="264" y="304" width="22" height="14" fill="#e0af68"/>
      <rect x="288" y="304" width="22" height="14" fill="#9ece6a"/>
      <rect x="312" y="304" width="22" height="14" fill="#7dcfff"/>
      <rect x="336" y="304" width="22" height="14" fill="#7aa2f7"/>
      <rect x="360" y="304" width="22" height="14" fill="#bb9af7"/>
      <rect x="384" y="304" width="22" height="14" fill="#c0caf5"/>
    </g>
  </g>

  <!-- closing prompt with blinking caret -->
  <g class="line l12">
    <text x="34" y="368"><tspan class="grn">althof@fedora</tspan><tspan class="dim"> ~ </tspan><tspan class="blu">❯ </tspan></text>
    <rect x="152" y="355" width="9" height="17" fill="url(#glow)" class="caret"/>
  </g>

  <!-- subtle gradient border accent -->
  <rect x="10.5" y="10.5" width="759" height="409" rx="13.5" fill="none" stroke="url(#glow)" stroke-opacity="0.35"/>
</svg>
